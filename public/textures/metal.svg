<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320">
  <filter id="brush" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.003 0.7" numOctaves="2" seed="5" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.9  0 0 0 0 0.88  0 0 0 0 0.84  0 0 0 0.16 0"/>
  </filter>
  <filter id="wear" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="3" seed="9" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.2  0 0 0 0 0.17  0 0 0 0 0.12  0 0 0 0.7 -0.2"/>
  </filter>
  <filter id="pits" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="1" seed="2" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.15  0 0 0 0 0.13  0 0 0 0 0.1  0 0 0 -2.6 1.65"/>
    <feComponentTransfer><feFuncA type="discrete" tableValues="0 0 0 0 0 0 0 0 0.6"/></feComponentTransfer>
  </filter>
  <rect width="100%" height="100%" filter="url(#brush)"/>
  <rect width="100%" height="100%" filter="url(#wear)"/>
  <rect width="100%" height="100%" filter="url(#pits)"/>
</svg>
