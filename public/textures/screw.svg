<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <!-- Domed head: light where it faces the lamp above-left, dark bronze at its rim -->
    <radialGradient id="head" cx="44%" cy="38%" r="64%">
      <stop offset="0" stop-color="#cbc2b0"/>
      <stop offset="0.35" stop-color="#a39985"/>
      <stop offset="0.75" stop-color="#6a6152"/>
      <stop offset="1" stop-color="#352e26"/>
    </radialGradient>
    <linearGradient id="seat" x1="0.25" y1="0.2" x2="0.75" y2="0.8">
      <stop offset="0" stop-color="#16120e" stop-opacity="0.9"/>
      <stop offset="0.7" stop-color="#2a241d" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#d9cfbd" stop-opacity="0.55"/>
    </linearGradient>
  </defs>
  <circle cx="16" cy="16" r="15.6" fill="url(#seat)"/>
  <circle cx="16" cy="16" r="13.4" fill="#1d1914"/>
  <circle cx="16" cy="16" r="12.6" fill="url(#head)"/>
  <ellipse cx="12.6" cy="10.6" rx="4.2" ry="2.4" fill="#f4ecdc" opacity="0.3" transform="rotate(-30 12.6 10.6)"/>
  <!-- Phillips recess: lit on its lower walls -->
  <path d="M16.5 9.9v13M10 16.5h13" stroke="#e2d8c6" stroke-width="4.2" stroke-linecap="round" opacity="0.5"/>
  <path d="M16 9.2v13.6M9.2 16h13.6" stroke="#0c0a08" stroke-width="4.2" stroke-linecap="round"/>
</svg>
