<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <!-- Countersink: in shadow at the top left, catching light at the bottom right -->
    <linearGradient id="sink" x1="0.2" y1="0.15" x2="0.8" y2="0.85">
      <stop offset="0" stop-color="#2c271f" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#5a5144" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#fffaf0" stop-opacity="0.75"/>
    </linearGradient>
    <radialGradient id="head" cx="40%" cy="34%" r="72%">
      <stop offset="0" stop-color="#a49d90"/>
      <stop offset="0.5" stop-color="#6d665b"/>
      <stop offset="1" stop-color="#2f2b25"/>
    </radialGradient>
  </defs>
  <circle cx="16" cy="16" r="15.5" fill="url(#sink)"/>
  <circle cx="16" cy="16" r="13.6" fill="#24201b"/>
  <circle cx="16" cy="16" r="12.4" fill="url(#head)"/>
  <!-- Phillips recess: lit on its lower right walls -->
  <path d="M16.7 9.4v14M9.7 16.7h14" stroke="#b4ac9f" stroke-width="4.6" stroke-linecap="round" opacity="0.7"/>
  <path d="M16 8.7v14M9 16h14" stroke="#0d0c0a" stroke-width="4.6" stroke-linecap="round"/>
</svg>
