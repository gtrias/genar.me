<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320">
  <filter id="speckle" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="1" seed="7" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.36  0 0 0 0 0.26  0 0 0 0 0.14  0 0 0 -2.4 1.55"/>
    <feComponentTransfer><feFuncA type="discrete" tableValues="0 0 0 0 0 0 0 0.55 0.8"/></feComponentTransfer>
  </filter>
  <filter id="blotch" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="3" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.42  0 0 0 0 0.33  0 0 0 0 0.18  0 0 0 0.9 -0.22"/>
  </filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="11" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.3  0 0 0 0 0.27  0 0 0 0 0.2  0 0 0 0.1 0"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#blotch)"/>
  <rect width="100%" height="100%" filter="url(#grain)"/>
  <rect width="100%" height="100%" filter="url(#speckle)"/>
</svg>
